<!doctype html><html lang="en-GB"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#091225"><title>PHY1001 | Waves Challenge</title><style>
:root{color-scheme:dark;--bg:#091225;--surface:#14213b;--raised:#1a2c4b;--ink:#f0f6ff;--muted:#b5c5dc;--accent:#73dae8;--gold:#ffd27b;--green:#80e1b4;--red:#ff9ba7;--line:#425878}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 95% 0%,#214267 0,transparent 52%),var(--bg);color:var(--ink);font:16px/1.55 system-ui,-apple-system,'Segoe UI',sans-serif}main{max-width:960px;padding:22px 18px 65px;margin:auto}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.brand{letter-spacing:.15em;text-transform:uppercase;font-size:.78rem;font-weight:850;color:var(--accent)}.chip{border:1px solid var(--line);padding:7px 13px;border-radius:24px;font-size:.86rem;color:var(--muted)}.card{background:linear-gradient(150deg,var(--surface),#101a30);border:1px solid var(--line);border-radius:22px;padding:clamp(20px,4vw,34px);margin-top:20px;box-shadow:0 15px 55px #0003}h1{font-size:clamp(2.2rem,5vw,3.5rem);line-height:1.1;letter-spacing:-.04em;margin:14px 0}h2{font-size:clamp(1.4rem,3vw,1.95rem);line-height:1.3;margin:12px 0}p{color:var(--muted)}.eyebrow{font-size:.78rem;text-transform:uppercase;letter-spacing:.13em;font-weight:850;color:var(--gold)}.round-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:22px 0}.round{padding:13px;border:1px solid var(--line);background:#1a2b48;border-radius:12px;display:flex;align-items:center;gap:11px;color:var(--ink);text-align:left}.round.selected{border-color:var(--accent)}.round small{display:block;color:var(--muted)}.round .num{width:32px;height:32px;border-radius:9px;display:grid;place-items:center;background:#284565;flex:none;color:var(--accent);font-weight:850}button{font:inherit;cursor:pointer}button:focus-visible{outline:3px solid var(--gold);outline-offset:3px}button:disabled{opacity:.55;cursor:default}.actions{display:flex;gap:11px;flex-wrap:wrap;margin-top:24px}.primary,.secondary{border:1px solid transparent;min-height:46px;border-radius:12px;padding:11px 19px;font-weight:800}.primary{background:var(--accent);color:#08162b}.primary:hover{background:#c0f5fa}.secondary{background:transparent;color:var(--ink);border-color:var(--line)}.secondary:hover{background:#274364}.progress{height:9px;border-radius:9px;background:#33435b;overflow:hidden;margin:18px 0 8px}.progress>div{height:100%;background:linear-gradient(90deg,var(--accent),var(--green));transition:width .25s}.small{font-size:.86rem;color:var(--muted)}.answers{display:grid;gap:11px;margin-top:21px}.answer{border:2px solid transparent;background:var(--raised);color:var(--ink);border-radius:13px;display:flex;text-align:left;gap:13px;align-items:flex-start;padding:14px;min-height:52px}.answer:not(:disabled):hover{border-color:var(--accent)}.answer.correct{border-color:var(--green);background:#164737}.answer.wrong{border-color:var(--red);background:#512b3c}.answer:disabled{opacity:1}.letter{min-width:29px;height:29px;border-radius:8px;border:1px solid #7594b5;text-align:center;font-weight:800}.feedback{border-left:4px solid var(--green);background:#193b4c;border-radius:0 11px 11px 0;padding:14px 16px;margin-top:20px}.feedback.wrong{border-color:var(--red)}.feedback p{color:var(--ink);margin:5px 0}.visual{border:1px solid var(--line);background:#091a31;border-radius:14px;margin-top:20px;padding:12px}.visual-head{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:7px}.visual canvas{width:100%;height:175px;display:block}.visual-buttons{display:flex;gap:6px;align-items:center}.visual-buttons button{font-size:.79rem;background:#243a5a;border:1px solid var(--line);color:var(--ink);border-radius:7px;padding:4px 9px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:20px 0}.stat{border-radius:12px;background:var(--raised);padding:12px}.stat b{font-size:1.4rem;display:block}.stat span{font-size:.82rem;color:var(--muted)}.missed{padding-left:22px}.missed li{margin:10px 0}.foot{font-size:.78rem;color:#aabbd4;margin-top:26px}.hidden{display:none!important}@media(max-width:590px){.round-grid{grid-template-columns:1fr}.stats{grid-template-columns:1fr 1fr}.visual canvas{height:145px}}@media(prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important}}
</style></head><body><main><header class="top"><span class="brand">PHY1001 · Waves</span><span class="chip">Interactive revision game</span></header><div id="app"></div><footer class="foot">PHY1001 Waves Challenge · Self-contained activity for GitHub Pages. No SCORM required.</footer></main><script>
'use strict';
const QUESTIONS=[{"round":1,"question":"Which statement best describes a travelling wave?","options":["The material travels from source to observer","Energy propagates without net transport of the medium","Every particle moves at the wave speed","All particles move in the same direction at the same time"],"correct":1,"explanation":"A wave transfers energy while particles of a material medium oscillate locally about their equilibrium positions.","page":1,"visual":"transverse"},{"round":1,"question":"In a transverse wave moving to the right, which direction does the medium vibrate?","options":["To the right only","To the left only","Perpendicular to the direction of travel","In the same direction as the wave"],"correct":2,"explanation":"Transverse refers to motion perpendicular to the direction in which the disturbance propagates.","page":1,"visual":"transverse"},{"round":1,"question":"Which example is predominantly a longitudinal wave?","options":["A wave on a taut string","An electromagnetic wave in vacuum","A sound wave in air","An ideal transverse ripple on a rope"],"correct":2,"explanation":"Sound in air propagates through alternating compressions and rarefactions parallel to the direction of propagation.","page":1,"visual":"longitudinal"},{"round":1,"question":"If a pulse moves along a rope, what does a marked point on the rope do?","options":["Travel alongside the pulse","Move locally as the disturbance passes","Remain permanently displaced after the pulse","Move at the speed of light"],"correct":1,"explanation":"Individual points of the rope move locally; the disturbance itself travels along the rope.","page":1,"visual":"transverse"},{"round":1,"question":"A longitudinal wave can be recognised by which feature?","options":["Successive compressions and rarefactions","A fixed node at the midpoint","Only sideways particle motion","A displacement always perpendicular to propagation"],"correct":0,"explanation":"Regions of compression and rarefaction are characteristic of longitudinal waves.","page":1,"visual":"longitudinal"},{"round":2,"question":"A travelling wave is described by y = A sin(kx − ωt). In which direction does it propagate?","options":["Negative x","Positive x","Positive y","It is stationary"],"correct":1,"explanation":"At fixed phase, kx − ωt is constant, so x increases as t increases for positive k and ω.","page":3,"visual":"transverse"},{"round":2,"question":"What does the wavenumber k = 2π/λ measure?","options":["The number of complete cycles per second","The amplitude per unit distance","Phase change per unit distance","The propagation speed"],"correct":2,"explanation":"The wavenumber is the spatial rate of change of phase, in radians per metre.","page":3,"visual":"transverse"},{"round":2,"question":"A wave has frequency 5 Hz and wavelength 0.8 m. What is its speed?","options":["0.16 m s⁻¹","4.0 m s⁻¹","5.8 m s⁻¹","6.25 m s⁻¹"],"correct":1,"explanation":"Using v = fλ, the speed is 5 × 0.8 = 4.0 m s⁻¹.","page":2,"visual":"transverse"},{"round":2,"question":"If the wavelength halves whilst wave speed stays constant, what happens to frequency?","options":["It halves","It stays constant","It doubles","It becomes zero"],"correct":2,"explanation":"From v = fλ, frequency must double if wavelength halves at fixed speed.","page":2,"visual":"transverse"},{"round":2,"question":"Why does the wave equation involve second derivatives in both x and t?","options":["A travelling wave varies with position and time","The wave must accelerate uniformly","The wave is necessarily damped","Every wave has two frequencies"],"correct":0,"explanation":"The one-dimensional wave equation links the spatial curvature of displacement to its second time derivative.","page":3,"visual":"transverse"},{"round":3,"question":"A siren travels towards a stationary listener. What happens to the observed pitch?","options":["It falls","It rises","It is unchanged","It disappears"],"correct":1,"explanation":"Wavefronts are closer together ahead of the moving source, giving a higher observed frequency.","page":5,"visual":"doppler"},{"round":3,"question":"A sound source moves away from a stationary observer. Which statement is true?","options":["The emitted frequency at the source changes","The observed frequency decreases","The speed of sound through the air increases","The listener encounters more wavefronts each second"],"correct":1,"explanation":"A receding moving source stretches the separation of wavefronts reaching the observer.","page":5,"visual":"doppler"},{"round":3,"question":"An observer moves towards a stationary sound source. Which quantity stays unchanged in the air?","options":["The rate at which the observer encounters crests","The wavelength emitted by the source","The frequency measured by the observer","The time between arriving crests for the observer"],"correct":1,"explanation":"When the source is stationary in the medium, the emitted wavelength remains unchanged; the moving observer encounters wavefronts more often.","page":6,"visual":"doppler"},{"round":3,"question":"How do the moving-source and moving-observer cases differ?","options":["Only a moving observer changes the emitted wavelength","Only a moving source changes the wavefront spacing in the medium","Neither changes measured frequency","Both necessarily change the wave speed relative to the medium"],"correct":1,"explanation":"A moving source changes spacing between successive wavefronts in the medium; a moving observer changes the rate at which they are encountered.","page":5,"visual":"doppler"},{"round":3,"question":"A radar signal reflects from a car approaching the radar. Why does the return frequency shift?","options":["The light slows to the car speed","The signal experiences a moving-observer and then a moving-source shift","The original radar frequency is reduced by half","Reflection removes the effect of motion"],"correct":1,"explanation":"The car first receives the signal as a moving observer and then reflects it as an effective moving source.","page":7,"visual":"doppler"},{"round":4,"question":"Measurements are taken every 0.02 s. What is the sampling frequency?","options":["0.02 Hz","20 Hz","50 Hz","100 Hz"],"correct":2,"explanation":"Sampling frequency is 1/Δt = 1/0.02 = 50 Hz.","page":9,"visual":"sampling"},{"round":4,"question":"What is the Nyquist frequency for a sampling rate of 100 Hz?","options":["25 Hz","50 Hz","100 Hz","200 Hz"],"correct":1,"explanation":"The Nyquist frequency is half the sampling frequency: 50 Hz.","page":9,"visual":"sampling"},{"round":4,"question":"To measure a 150 Hz oscillation without sampling below the Nyquist limit, which sampling frequency is appropriate?","options":["100 Hz","150 Hz","200 Hz","400 Hz"],"correct":3,"explanation":"The sampling rate must exceed twice the signal frequency in practice; 400 Hz is the only suitable option.","page":10,"visual":"sampling"},{"round":4,"question":"Two signals differ in frequency by 0.2 Hz. Approximately how long should the recording last to resolve them?","options":["0.2 s","1 s","5 s","50 s"],"correct":2,"explanation":"The characteristic frequency resolution is δf ≈ 1/t, so resolving 0.2 Hz requires about 5 seconds of data.","page":9,"visual":"sampling"},{"round":4,"question":"What does a Fourier transform help identify in a measured time series?","options":["The position of every particle","The frequencies contributing to the signal","The total mass of the medium","The direction of gravity"],"correct":1,"explanation":"A Fourier transform displays a time series in the frequency domain, revealing frequency components that may not be obvious by eye.","page":8,"visual":"sampling"},{"round":5,"question":"Under the principle of superposition, two overlapping wave displacements combine by…","options":["Multiplying the displacements","Taking their average","Adding the displacements algebraically","Keeping the larger displacement"],"correct":2,"explanation":"For waves in a linear medium, the instantaneous resultant displacement is the algebraic sum.","page":10,"visual":"interference"},{"round":5,"question":"Two equal-amplitude coherent waves arrive in phase. What is their resultant amplitude?","options":["Zero","A","2A","A/2"],"correct":2,"explanation":"Their displacements reinforce each other, producing constructive interference with amplitude 2A.","page":12,"visual":"interference"},{"round":5,"question":"Two equal-amplitude waves have a phase difference of π radians. What happens?","options":["Their amplitude doubles","They cancel completely","Their frequency doubles","They travel in opposite directions"],"correct":1,"explanation":"Equal waves exactly out of phase undergo complete destructive interference.","page":12,"visual":"interference"},{"round":5,"question":"Why must sources have a stable phase relationship to produce a persistent interference pattern?","options":["It makes their waves travel faster","It ensures the interference pattern does not fluctuate randomly","It removes all energy from the waves","It forces both amplitudes to be zero"],"correct":1,"explanation":"Coherent waves have a stable phase relationship, giving predictable constructive and destructive interference.","page":12,"visual":"interference"},{"round":5,"question":"Two equal-amplitude waves of the same frequency differ in phase by 2π/3. What is the resultant amplitude?","options":["0","A","√3 A","2A"],"correct":1,"explanation":"The resultant amplitude magnitude is 2A|cos(φ/2)| = 2A cos(π/3) = A.","page":12,"visual":"interference"},{"round":6,"question":"What produces audible beats?","options":["Two very different amplitudes at exactly the same frequency","Two waves with slightly different frequencies superimposed","One wave moving through empty space","A wave with zero amplitude"],"correct":1,"explanation":"Nearby frequencies alternately reinforce and cancel, causing periodic variation in the resultant amplitude.","page":14,"visual":"beats"},{"round":6,"question":"Two tones have frequencies of 440 Hz and 444 Hz. How many loudness maxima (beats) occur each second?","options":["2","4","442","884"],"correct":1,"explanation":"The repetition rate of audible beats is |f₁ − f₂| = 4 Hz.","page":15,"visual":"beats"},{"round":6,"question":"During a beat pattern, what changes slowly compared with the underlying rapid oscillation?","options":["The medium density everywhere","The amplitude envelope","The speed of light in vacuum","The direction of gravity"],"correct":1,"explanation":"The rapidly oscillating combined wave has a slowly varying amplitude envelope.","page":15,"visual":"beats"},{"round":6,"question":"If two nearby tones are adjusted to exactly the same frequency and remain in phase, what happens to the beats?","options":["They become faster","They disappear, leaving steady constructive interference","The waves stop propagating","Their combined frequency becomes zero"],"correct":1,"explanation":"With no frequency difference, relative phase no longer drifts, so there is no periodic beating.","page":14,"visual":"beats"},{"round":6,"question":"Two frequencies are 200 Hz and 206 Hz. How often does the loudness pattern repeat?","options":["Every 1/6 s","Every 3 s","Every 6 s","Every 406 s"],"correct":0,"explanation":"The beat repetition frequency is 6 Hz, corresponding to one loudness maximum approximately every 1/6 s.","page":15,"visual":"beats"}];
const ROUND_NAMES=["Wave fundamentals", "Travelling-wave equations", "Doppler effect", "Detecting waves", "Superposition and interference", "Beats"];
const app=document.getElementById('app');
let selection=0,items=[],index=0,score=0,answers=[],phase='home',visualName='transverse',visualPaused=false,time=0,lastFrame=0,animSpeed=1;
const h=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const byId=id=>document.getElementById(id);
function visualMarkup(kind){return `<section class="visual"><div class="visual-head"><span class="small">Animated demonstration · ${h(({transverse:'transverse travelling wave',longitudinal:'longitudinal wave',doppler:'moving source',sampling:'sampling a wave',interference:'superposition',beats:'beats and amplitude envelope'})[kind])}</span><div class="visual-buttons"><button id="toggleAnim" type="button">Pause</button><button id="resetAnim" type="button">Restart</button><button id="speedAnim" type="button">1× speed</button></div></div><canvas id="waveCanvas" role="img" aria-label="Animated illustration of ${h(kind)}"></canvas><div class="small">Illustrative animation (not to scale)</div></section>`}
function bindViz(kind){visualName=kind;time=0;visualPaused=window.matchMedia('(prefers-reduced-motion: reduce)').matches;animSpeed=1;byId('toggleAnim').textContent=visualPaused?'Play':'Pause';byId('toggleAnim').onclick=()=>{visualPaused=!visualPaused;byId('toggleAnim').textContent=visualPaused?'Play':'Pause'};byId('resetAnim').onclick=()=>{time=0;draw()};byId('speedAnim').onclick=()=>{animSpeed=animSpeed===1?0.5:animSpeed===0.5?2:1;byId('speedAnim').textContent=animSpeed+'× speed'};draw()}
function start(sel){selection=sel;items=QUESTIONS.map((q,i)=>({...q,original:i})).filter(q=>selection===0||q.round===selection);index=0;score=0;answers=[];phase='question';renderQuestion()}
function home(){phase='home';app.innerHTML=`<section class="card"><div class="eyebrow">PHY1001 · Foundation Physics</div><h1>Waves Challenge</h1><p>Test your understanding of travelling waves, Doppler shifts, detecting waves, interference and beats. Choose a single round or complete all 30 questions.</p><div class="stats"><div class="stat"><b>30</b><span>multiple-choice questions</span></div><div class="stat"><b>6</b><span>topic rounds</span></div><div class="stat"><b>Instant</b><span>feedback and explanations</span></div></div>${visualMarkup('transverse')}<div class="eyebrow" style="margin-top:24px">Choose a round</div><div class="round-grid">${ROUND_NAMES.map((name,i)=>`<button type="button" class="round" data-round="${i+1}"><span class="num">${i+1}</span><span><strong>${h(name)}</strong><small>5 questions</small></span></button>`).join('')}</div><div class="actions"><button class="primary" id="all" type="button">Play all 30 questions →</button></div></section>`;document.querySelectorAll('[data-round]').forEach(b=>b.onclick=()=>start(Number(b.dataset.round)));byId('all').onclick=()=>start(0);bindViz('transverse')}
function renderQuestion(){let q=items[index];let num=index+1;app.innerHTML=`<section class="card"><div class="eyebrow">${selection===0?`Full challenge · Round ${q.round}: ${h(ROUND_NAMES[q.round-1])}`:h(ROUND_NAMES[selection-1])}</div><div class="small">Question ${num} of ${items.length} · Score ${score}/${index}</div><div class="progress" role="progressbar" aria-valuenow="${index}" aria-valuemin="0" aria-valuemax="${items.length}" aria-label="Quiz progress"><div style="width:${100*index/items.length}%"></div></div><h2>${h(q.question)}</h2>${visualMarkup(q.visual)}<div class="answers" id="answers">${q.options.map((o,i)=>`<button class="answer" type="button" data-choice="${i}"><span class="letter">${'ABCD'[i]}</span><span>${h(o)}</span></button>`).join('')}</div><div id="response" aria-live="polite"></div><div class="actions"><button class="secondary" id="exit" type="button">Back to rounds</button><button class="primary hidden" id="next" type="button">${num===items.length?'View results':'Next question →'}</button></div></section>`;document.querySelectorAll('[data-choice]').forEach(b=>b.onclick=()=>choose(Number(b.dataset.choice)));byId('exit').onclick=home;byId('next').onclick=()=>{index++;if(index===items.length)results();else renderQuestion()};bindViz(q.visual)}
function choose(choice){const q=items[index];if(answers[index]!==undefined)return;answers[index]=choice;if(choice===q.correct)score++;document.querySelectorAll('[data-choice]').forEach(b=>{let i=Number(b.dataset.choice);b.disabled=true;if(i===q.correct)b.classList.add('correct');else if(i===choice)b.classList.add('wrong')});byId('response').innerHTML=`<div class="feedback ${choice===q.correct?'':'wrong'}"><strong>${choice===q.correct?'Correct!':'Not quite.'}</strong><p>${h(q.explanation)}</p><div class="small">Reference: PHY1001 Waves notes, page ${q.page}.</div></div>`;byId('next').classList.remove('hidden')}
function results(){phase='results';const pct=Math.round(score/items.length*100),missed=items.filter((q,i)=>answers[i]!==q.correct);app.innerHTML=`<section class="card"><div class="eyebrow">Challenge completed</div><h1>${pct>=80?'Excellent work!':pct>=60?'Good progress!':'Keep practising!'}</h1><div class="stats"><div class="stat"><b>${score}/${items.length}</b><span>correct answers</span></div><div class="stat"><b>${pct}%</b><span>final score</span></div><div class="stat"><b>${missed.length}</b><span>questions to revisit</span></div></div><p>${missed.length?'Review the questions below, then try again.':'You answered every question correctly.'}</p>${missed.length?`<h2>Review these concepts</h2><ol class="missed">${missed.map(q=>`<li><strong>${h(q.question)}</strong><div class="small">Correct: ${h(q.options[q.correct])}. ${h(q.explanation)} (Notes p. ${q.page})</div></li>`).join('')}</ol>`:''}<div class="actions"><button class="primary" id="retry" type="button">Play again</button><button class="secondary" id="choose" type="button">Choose a round</button></div><p class="foot">Scores are displayed here for revision and are not sent to Canvas.</p></section>`;byId('retry').onclick=()=>start(selection);byId('choose').onclick=home}
function draw(){const can=byId('waveCanvas');if(!can)return;const dpr=Math.min(devicePixelRatio||1,2),w=can.clientWidth||700,hh=can.clientHeight||175;if(can.width!==Math.round(w*dpr)||can.height!==Math.round(hh*dpr)){can.width=Math.round(w*dpr);can.height=Math.round(hh*dpr)}const c=can.getContext('2d');c.setTransform(dpr,0,0,dpr,0,0);c.clearRect(0,0,w,hh);const left=22,right=w-22,mid=hh/2,span=right-left,PI=Math.PI;const line=(fn,color,width=2)=>{c.strokeStyle=color;c.lineWidth=width;c.beginPath();for(let j=0;j<=260;j++){let x=left+span*j/260,y=fn(j/260,x);if(j===0)c.moveTo(x,y);else c.lineTo(x,y)}c.stroke()};const label=(txt,x,y,color='#b5c5dc')=>{c.fillStyle=color;c.font='12px system-ui';c.fillText(txt,x,y)};c.strokeStyle='#41577b';c.lineWidth=1;c.beginPath();c.moveTo(left,mid);c.lineTo(right,mid);c.stroke();if(visualName==='transverse'){line((u)=>mid-40*Math.sin(4*PI*u-time*2),'#73dae8',3);const u=.44,y=mid-40*Math.sin(4*PI*u-time*2);c.fillStyle='#ffd27b';c.beginPath();c.arc(left+span*u,y,6,0,2*PI);c.fill();label('Wave travels →',right-105,21);label('Particle vibrates ↕',left+8,22)}else if(visualName==='longitudinal'){for(let j=0;j<65;j++){let u=j/64,x=left+span*u+12*Math.sin(4*PI*u-time*2),y=mid;c.fillStyle='#73dae8';c.beginPath();c.arc(x,y,3,0,2*PI);c.fill()}label('Propagation →',right-120,22);label('Particles move ↔',left+8,22)}else if(visualName==='interference'){const wa=(u)=>18*Math.sin(4*PI*u-time*2),wb=(u)=>18*Math.sin(4*PI*u-time*2+PI/2);line(u=>mid-24+wa(u),'#75baff',2);line(u=>mid+24+wb(u),'#ffce7b',2);line(u=>mid-wa(u)-wb(u),'#78e5b5',3);label('Blue + yellow = green',left+5,20)}else if(visualName==='beats'){const f1=11,f2=12;line(u=>mid-27*Math.sin(2*PI*f1*u-time*2)-27*Math.sin(2*PI*f2*u-time*2),'#73dae8',2.5);line(u=>mid-54*Math.abs(Math.cos(PI*(f2-f1)*u-time*.25)),'#ffd27b',1.5);line(u=>mid+54*Math.abs(Math.cos(PI*(f2-f1)*u-time*.25)),'#ffd27b',1.5);label('Slow amplitude envelope',left+7,20)}else if(visualName==='doppler'){const sx=left+span*(.25+.4*(.5+.5*Math.sin(time*.33))),sy=mid;for(let i=0;i<6;i++){let age=(time*.42+i/6)%1,rad=age*span*.6;c.beginPath();c.arc(sx-age*span*.11,sy,rad,0,2*PI);c.lineWidth=1.7;c.strokeStyle='#73dae8';c.stroke()}c.fillStyle='#ffd27b';c.beginPath();c.arc(sx,sy,7,0,2*PI);c.fill();label('Moving source →',left+7,22)}else if(visualName==='sampling'){line(u=>mid-39*Math.sin(4*PI*u-time),'#73dae8',2);for(let i=0;i<=22;i++){let u=i/22,x=left+span*u,y=mid-39*Math.sin(4*PI*u-time);c.strokeStyle='#ffa6a6';c.beginPath();c.moveTo(x,mid);c.lineTo(x,y);c.stroke();c.fillStyle='#ffd27b';c.beginPath();c.arc(x,y,3.4,0,2*PI);c.fill()}label('Sampled points',left+7,22)}}
function frame(stamp){if(!lastFrame)lastFrame=stamp;const dt=Math.min((stamp-lastFrame)/1000,.08);lastFrame=stamp;if(!visualPaused)time+=dt*animSpeed;draw();requestAnimationFrame(frame)}
requestAnimationFrame(frame);home();
</script></body></html>
