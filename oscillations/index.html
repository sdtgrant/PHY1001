tions,footer{display:none}}

/* Interactive, self-contained oscillator visualisation */

.sim-header{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;margin-bottom:8px}
.sim-header strong{font-size:.96rem;color:var(--text)}
.sim-svg{display:block;width:100%;height:auto;max-height:220px}
.sim-controls{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:10px 0 2px}
.sim-controls select,.sim-controls button{background:#223854;color:var(--text);border:1px solid #607894;border-radius:9px;padding:8px 10px;font:inherit}
.sim-controls label{font-size:.83rem;color:var(--muted)}
.sim-hint{font-size:.77rem;color:var(--muted);margin:8px 0 0}
.sim-readouts{display:flex;gap:14px;flex-wrap:wrap;color:#cae3fa;font-size:.82rem;font-variant-numeric:tabular-nums}
@media(prefers-reduced-motion:reduce){.sim-svg *{animation:none!important}}

<script>
'use strict';const BANK=[{"round": 0, "question": "What is the defining feature of simple harmonic motion (SHM)?", "choices": ["The speed is constant", "Acceleration is proportional to displacement and towards equilibrium", "Acceleration is always zero", "The restoring force always points away from equilibrium"], "answer": 1, "explanation": "In SHM, a = -ω²x: acceleration is proportional to displacement and directed towards equilibrium.", "page": 3}, {"round": 0, "question": "A mass attached to a spring is displaced to the right of equilibrium. In which direction is the spring force?", "choices": ["Right", "Left", "Upwards", "The force is zero"], "answer": 1, "explanation": "Hooke’s law F = -kx means the restoring force opposes displacement.", "page": 3}, {"round": 0, "question": "A spring becomes four times stiffer while its attached mass is unchanged. What happens to angular frequency?", "choices": ["Halves", "Doubles", "Quadruples", "Remains unchanged"], "answer": 1, "explanation": "ω = √(k/m), so multiplying k by four multiplies ω by two.", "page": 4}, {"round": 0, "question": "At the positive maximum displacement of an ideal SHM oscillator, which statement is correct?", "choices": ["Velocity and acceleration are both zero", "Velocity is zero; acceleration points towards equilibrium", "Velocity is maximum; acceleration is zero", "Velocity and acceleration are maximum in the same direction"], "answer": 1, "explanation": "At a turning point the velocity is zero, while the restoring acceleration has its maximum magnitude.", "page": 6}, {"round": 0, "question": "What does the phase constant φ in x = A sin(ωt + φ) specify?", "choices": ["The mass of the oscillator", "The starting point in the oscillation cycle", "The rate of energy loss", "The spring constant"], "answer": 1, "explanation": "The initial conditions set the phase constant and hence where the oscillator begins in its cycle.", "page": 5}, {"round": 1, "question": "For small oscillations, what determines the period of an ideal simple pendulum?", "choices": ["Bob mass and amplitude", "Length and gravitational acceleration", "Bob mass alone", "The strength of air resistance alone"], "answer": 1, "explanation": "For small angles T = 2π√(L/g), independent of bob mass and (approximately) amplitude.", "page": 10}, {"round": 1, "question": "If a simple pendulum’s length is increased by a factor of four, its small-angle period…", "choices": ["Halves", "Doubles", "Quadruples", "Does not change"], "answer": 1, "explanation": "T ∝ √L, so a fourfold increase in length doubles the period.", "page": 10}, {"round": 1, "question": "Why is the small-angle approximation needed to treat a pendulum as SHM?", "choices": ["It makes gravity vanish", "It allows sin θ ≈ θ, giving acceleration proportional to angular displacement", "It removes the need for a restoring force", "It makes the bob mass zero"], "answer": 1, "explanation": "For sufficiently small θ in radians, sin θ ≈ θ and θ¨ = -(g/L)θ.", "page": 9}, {"round": 1, "question": "For an ideal horizontal mass–spring oscillator, where is the kinetic energy greatest?", "choices": ["At maximum extension", "At equilibrium", "At maximum compression", "It is the same everywhere"], "answer": 1, "explanation": "The speed is greatest at equilibrium, so kinetic energy is greatest there.", "page": 11}, {"round": 1, "question": "If the amplitude of an ideal mass–spring oscillator doubles, its total energy…", "choices": ["Halves", "Doubles", "Quadruples", "Remains the same"], "answer": 2, "explanation": "E = ½kA²: doubling A multiplies the energy by four.", "page": 11}, {"round": 2, "question": "What direction does a damping force Fd = -bv act?", "choices": ["Along the velocity", "Opposite the velocity", "Always towards the right", "Always away from equilibrium"], "answer": 1, "explanation": "The minus sign means this resistive force acts opposite to instantaneous velocity.", "page": 15}, {"round": 2, "question": "An underdamped oscillator is left alone. Which description best fits its motion?", "choices": ["It oscillates with decreasing amplitude", "Its amplitude grows exponentially", "It never crosses equilibrium", "Its frequency increases without limit"], "answer": 0, "explanation": "Underdamping produces an oscillatory motion inside a decaying amplitude envelope.", "page": 16}, {"round": 2, "question": "For x = A e^(-αt) sin(ω′t + φ), what does e^(-αt) describe?", "choices": ["The natural angular frequency", "The decaying amplitude envelope", "A constant change of phase", "The restoring acceleration"], "answer": 1, "explanation": "The exponential term causes the oscillation envelope to shrink with time.", "page": 16}, {"round": 2, "question": "Compared with an undamped oscillator of the same mass and spring constant, the underdamped angular frequency ω′ is…", "choices": ["Always greater", "Always equal", "Lower", "Always zero"], "answer": 2, "explanation": "ω′ = √(ω₀² - α²), so damping reduces the oscillation frequency.", "page": 16}, {"round": 2, "question": "If the damping coefficient b is increased while the mass stays fixed, what happens to the amplitude decay rate α = b/(2m)?", "choices": ["It decreases", "It increases", "It becomes negative", "It remains unchanged"], "answer": 1, "explanation": "The amplitude decay rate increases in direct proportion to b.", "page": 16}, {"round": 3, "question": "Which damping regime returns an oscillator to equilibrium as rapidly as possible without oscillating?", "choices": ["Underdamping", "Critical damping", "Overdamping", "Zero damping"], "answer": 1, "explanation": "Critical damping is the boundary between oscillatory and non-oscillatory responses.", "page": 20}, {"round": 3, "question": "What distinguishes an overdamped system from an underdamped system?", "choices": ["It oscillates at a higher frequency", "It does not undergo oscillations", "It has no resistance", "Its amplitude grows"], "answer": 1, "explanation": "Overdamped systems return towards equilibrium without repeatedly crossing it.", "page": 19}, {"round": 3, "question": "In the lightly damped approximation, if amplitude falls to half its initial value, how does oscillation energy change?", "choices": ["It halves", "It becomes one quarter", "It doubles", "It stays constant"], "answer": 1, "explanation": "Mechanical energy is proportional to the square of the amplitude.", "page": 23}, {"round": 3, "question": "Which description is associated with a high quality factor Q?", "choices": ["Strong damping and broad resonance", "Weak damping and sharp resonance", "No restoring force", "A stationary mass"], "answer": 1, "explanation": "A high Q corresponds to slow energy dissipation and a narrow resonance peak.", "page": 29}, {"round": 3, "question": "What is the energy e-folding time τ of the viscously damped oscillator described in the booklet?", "choices": ["b/m", "m/b", "2π/ω₀", "k/m"], "answer": 1, "explanation": "For E = E₀e^(-t/τ), the decay time is τ = m/b.", "page": 24}, {"round": 4, "question": "What makes forced harmonic motion different from free damped motion?", "choices": ["The mass must be larger", "A periodic external driving force acts on the system", "The restoring force disappears", "The motion cannot have damping"], "answer": 1, "explanation": "Forced oscillations involve an external periodic force which can replenish dissipated energy.", "page": 25}, {"round": 4, "question": "For a very slowly driven mass–spring system (ω_d ≪ ω₀), the displacement amplitude is approximately…", "choices": ["F₀/k", "F₀/(mω_d²)", "Zero for any F₀", "bω₀/F₀"], "answer": 0, "explanation": "At low driving frequency the motion is approximately quasi-static: A ≈ F₀/k.", "page": 25}, {"round": 4, "question": "What happens to the displacement amplitude at a very high driving frequency, with driving force amplitude fixed?", "choices": ["It increases without limit", "It tends towards zero", "It becomes independent of mass", "It always equals F₀/k"], "answer": 1, "explanation": "At high ω_d, inertia dominates and A ≈ F₀/(mω_d²).", "page": 26}, {"round": 4, "question": "For a lightly damped driven oscillator, the largest displacement response occurs near…", "choices": ["Zero driving frequency", "Its natural angular frequency", "An infinitely high frequency", "Half the gravitational acceleration"], "answer": 1, "explanation": "The familiar resonance peak lies near ω_d = ω₀ when damping is small.", "page": 27}, {"round": 4, "question": "At ω_d = ω₀, the steady-state displacement amplitude of the viscously damped driven system is…", "choices": ["F₀/k", "F₀/(bω₀)", "b/F₀", "Zero"], "answer": 1, "explanation": "At ω_d = ω₀, the amplitude formula reduces to A = F₀/(bω₀).", "page": 27}, {"round": 5, "question": "At very low driving frequency, how are displacement and driving force related?", "choices": ["Approximately in phase", "Displacement lags by 90°", "Displacement lags by 180°", "Displacement always leads by 90°"], "answer": 0, "explanation": "The system follows the applied force quasi-statically, with phase lag close to zero.", "page": 30}, {"round": 5, "question": "At ω_d = ω₀, how does steady-state displacement relate to the driving force?", "choices": ["In phase", "It lags by 90°", "It leads by 90°", "It lags by 360°"], "answer": 1, "explanation": "At ω_d = ω₀, displacement lags driving force by π/2 radians.", "page": 30}, {"round": 5, "question": "For driving frequencies far above ω₀, the displacement tends to be…", "choices": ["In phase with force", "90° ahead of force", "180° out of phase with force", "Always at rest"], "answer": 2, "explanation": "In the mass-controlled regime the displacement is nearly opposite the driving force.", "page": 27}, {"round": 5, "question": "Why does pushing a swing in the direction of its velocity transfer energy effectively?", "choices": ["The force does positive work on the swing", "The gravitational acceleration increases", "The swing loses its restoring force", "It changes the bob mass"], "answer": 0, "explanation": "Instantaneous power is force × velocity; aligned force and velocity produce positive work.", "page": 34}, {"round": 5, "question": "For a high-Q oscillator, how does its resonance peak compare with that of a low-Q oscillator?", "choices": ["Broader and flatter", "Narrower and taller", "Absent", "Always shifted to zero frequency"], "answer": 1, "explanation": "Smaller damping makes the resonance sharper and usually taller.", "page": 29}];const ROUNDS=["Foundations of SHM", "Pendulums and energy", "Damped oscillations", "Damping regimes and Q", "Forced oscillations", "Phase and applications"];const app=document.getElementById('app');let state={items:[],index:0,score:0,selected:null,mode:'all',responses:[],previousMistakes:[]};let lastCompleted=null;
const escapeHTML=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])).replace(/ω_d/g,'ω<sub>d</sub>');function shuffle(a){let b=[...a];for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b}

function simSpringPoints(end){
 let pts=['43,115','64,115'],start=64,finish=end-12,n=15;
 for(let i=0;i<n;i++){const x=start+(finish-start)*(i+1)/(n+1);pts.push(x.toFixed(2)+','+(i%2?127:103));}

function initSim(round){
 cancelAnimationFrame(simFrame);simFrame=0;simElapsed=0;simLast=0;

 if(!modeSelect)return;

 const pauseButton=document.getElementById('simPause');pauseButton.textContent=simPaused?'Play':'Pause';
 const modes={ideal:'Restoring acceleration is opposite to displacement; amplitude remains constant.',damped:'The amplitude envelope shrinks exponentially whilst the mass still oscillates.',forced:'At resonance, displacement lags the driving force by 90°. The yellow arrow shows the applied force.'};
 function paint(){
  if(!document.getElementById('simMode'))return;
  const mode=modeSelect.value,t=simElapsed,omega=2*Math.PI*.58;
  let x,v;
  if(mode==='damped'){const a=.24,w=omega*.96,e=Math.exp(-a*t);x=e*Math.sin(w*t);v=e*(w*Math.cos(w*t)-a*Math.sin(w*t))/omega;}
  else if(mode==='forced'){x=Math.sin(omega*t-Math.PI/2);v=Math.cos(omega*t-Math.PI/2);}
  else{x=Math.sin(omega*t);v=Math.cos(omega*t);}
  const centre=285+Math.round(x*94),left=centre-20;
  document.getElementById('simSpring').setAttribute('points',simSpringPoints(left));
  document.getElementById('simMass').setAttribute('x',String(left));
  document.getElementById('simMassLabel').setAttribute('x',String(centre));
  document.getElementById('simX').textContent='Displacement: '+(x>=0?'+':'')+x.toFixed(2)+' A₀';
  document.getElementById('simV').textContent='Velocity: '+(v>=0?'+':'')+v.toFixed(2)+' (relative)';
  document.getElementById('simT').textContent='t = '+t.toFixed(1)+' s';
  const arrow=document.getElementById('simForce'),forceText=document.getElementById('simForcingText');
  if(mode==='forced'){
   let f=Math.cos(omega*t),len=65*f,base=centre+37,tip=base+len;
   arrow.setAttribute('d',`M${base} 60 L${tip} 60 M${tip} 60 l${f>=0?-10:10} -7 M${tip} 60 l${f>=0?-10:10} 7`);
   forceText.textContent='Yellow: driving force';
  }else{arrow.setAttribute('d','');forceText.textContent='';}
  document.getElementById('simExplanation').textContent=modes[mode];
 }
 modeSelect.onchange=()=>{simElapsed=0;simLast=0;paint()};
 document.getElementById('simRestart').onclick=()=>{simElapsed=0;simLast=0;paint()};
 pauseButton.onclick=()=>{simPaused=!simPaused;pauseButton.textContent=simPaused?'Play':'Pause';pauseButton.setAttribute('aria-label',simPaused?'Play animation':'Pause animation');simLast=0};
 function frame(ts){if(!document.getElementById('simMode')||document.getElementById('simMode')!==modeSelect){simFrame=0;return;}
  if(simLast&&!simPaused){simElapsed+=Math.min((ts-simLast)/1000,.06)*Number(speedSelect.value)}
  simLast=ts;paint();simFrame=requestAnimationFrame(frame);
 }
 paint();simFrame=requestAnimationFrame(frame);
}

document.addEventListener('keydown',e=>{if(state.items.length&&state.index<state.items.length&&state.selected===null&&!e.altKey&&!e.ctrlKey&&!e.metaKey){let n='abcd'.indexOf(e.key.toLowerCase());if(n>=0){const b=document.querySelector(`[data-answer="${n}"]`);if(b)b.click()}}else if(state.selected!==null&&e.key==='Enter'&&document.getElementById('next'))document.getElementById('next').click()});home();
</script></body></html>
